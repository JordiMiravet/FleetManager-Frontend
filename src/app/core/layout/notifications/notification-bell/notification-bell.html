<div class="notification-bell-wrapper">
    <button
        class="notification-bell"
        type="button"
        [attr.aria-label]="notificationBellMsg.aria.button(pendingCount())"
        [attr.aria-expanded]="isPanelOpen()"
        (click)="togglePanel()"
    >
        <i class="pi pi-bell" aria-hidden="true"></i>

        @if (pendingCount() > 0) {
            <span
                class="notification-bell__badge"
                aria-hidden="true"
            >
                {{ pendingCount() }}
            </span>
        }
    </button>

    @if (isPanelOpen()) {
        <app-notification-dropdown
            [isEmpty]="pendingCount() === 0"
            [emptyMessage]="notificationBellMsg.emptyState"
            (close)="closePanel()"
        >
            <ul class="notification-bell__list">
                @for (invitation of pendingInvitations(); track invitation._id) {
                    <li>
                        <app-invitation-card 
                            [invitation]="invitation" 
                            (accept)="acceptInvitation($event)"
                            (decline)="declineInvitation($event)"
                        />
                    </li>
                }
            </ul>
        </app-notification-dropdown>
    }
</div>
