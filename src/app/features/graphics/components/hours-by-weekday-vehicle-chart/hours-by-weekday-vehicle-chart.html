<figure 
  class="chart-wrapper" 
  role="img" 
  aria-labelledby="hours-by-weekday-title"
  aria-describedby="hours-by-weekday-desc"
>
  <canvas #hoursByWeekday aria-hidden="true"></canvas>
  
  <figcaption id="hours-by-weekday-title" class="sr-only">
    {{ messages.hoursByWeekday.title }}
  </figcaption>
  
  <p id="hours-by-weekday-desc" class="sr-only">
    {{ messages.hoursByWeekday.description(period()) }}
  </p>
</figure>
