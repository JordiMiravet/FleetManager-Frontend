<figure 
  class="chart-wrapper" 
  role="img" 
  aria-labelledby="vehicle-usage-hours-title"
  aria-describedby="vehicle-usage-hours-desc"
>
  <canvas #vehicleUsageHours aria-hidden="true"></canvas>
  
  <figcaption id="vehicle-usage-hours-title" class="sr-only">
    {{ messages.vehicleUsageHours.title }}
  </figcaption>
  
  <p id="vehicle-usage-hours-desc" class="sr-only" aria-live="polite">
    {{ messages.vehicleUsageHours.description(period()) }}
  </p>
</figure>
