<figure 
  class="chart-wrapper" 
  role="img" 
  aria-labelledby="most-used-vehicle-title"
  aria-describedby="most-used-vehicle-desc"
>
  <canvas #mostUsedVehicle aria-hidden="true"></canvas>
  
  <figcaption id="most-used-vehicle-title" class="sr-only">
    {{ messages.mostUsedVehicle.title }}
  </figcaption>
  
  <p id="most-used-vehicle-desc" class="sr-only" aria-live="polite">
    {{ messages.mostUsedVehicle.description(period()) }}
  </p>
</figure>
