<section class="vehicle-actions">

  <div class="vehicle-actions__search">
    <i class="vehicle-actions__search-icon pi pi-search" aria-hidden="true"></i>
    <input
      type="text"
      class="vehicle-actions__search-input"
      [placeholder]="actionsMsg.searchPlaceholder"
      [attr.aria-label]="actionsMsg.aria.searchInput"
      (input)="onQueryChange($event)"
    />
  </div>

  <div class="vehicle-actions__sort">
    <button
      type="button"
      class="vehicle-actions__sort-button"
      [attr.aria-label]="actionsMsg.aria.sortDirButton"
      (click)="toggleSortDir()"
    >
      <i
        class="vehicle-actions__sort-icon pi"
        [class.pi-sort-amount-down]="sortDir() === 'asc'"
        [class.pi-sort-amount-up]="sortDir() === 'desc'"
      ></i>
    </button>
    
    <select
      class="vehicle-actions__sort-select"
      [attr.aria-label]="actionsMsg.aria.sortFieldSelect"
      (change)="onSortFieldChange($event)"
    >
      <option value="name" class="vehicle-actions__sort-option">{{ actionsMsg.sortOptions.name }}</option>
      <option value="model" class="vehicle-actions__sort-option">{{ actionsMsg.sortOptions.model }}</option>
      <option value="plate" class="vehicle-actions__sort-option">{{ actionsMsg.sortOptions.plate }}</option>
    </select>
  </div>

</section>
